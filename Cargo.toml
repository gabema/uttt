[workspace]
resolver = "2"
members = ["crates/uttt-core", "crates/uttt-web"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/gabema/uttt"

# Size- and compile-tuned release build. The delivered wasm is downloaded AND
# compiled on the client, so smaller output speeds up startup twice over. This
# is upstream of the `data-wasm-opt="z"` pass in index.html (which only polishes
# what rustc emits). See ADR / openspec change `optimize-web-startup`.
[profile.release]
opt-level = "z"     # optimize for size (measured: z 36.5KB gz vs s 37.6KB gz)
lto = true          # cross-crate inlining + dead-code elimination
codegen-units = 1   # better optimization at the cost of build parallelism
panic = "abort"     # drop unwinding tables/landing pads from the binary
strip = true        # strip symbols
