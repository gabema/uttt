<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UTTT Prototype</title>
    <link href="css/site.css" rel="stylesheet" />
  </head>
  <body>
    <div id="app">Loading...</div>
    <div id="blazor-status" style="position:fixed;right:8px;bottom:8px;padding:6px;background:#eef;border:1px solid #ccd;border-radius:4px;font-size:12px">blazor: unknown</div>
    <div id="blazor-errors" style="position:fixed;left:8px;bottom:8px;max-width:40%;max-height:40vh;overflow:auto;padding:8px;background:#fff7f7;border:1px solid #f5c6cb;border-radius:6px; font-size:12px; color:#600; display:none"></div>
    <script>
      // Show Blazor load status and capture client-side errors so the simple browser can display them.
      function setStatus(s){
        var el = document.getElementById('blazor-status'); if(el) el.innerText = 'blazor: ' + s;
      }

      function showError(msg){
        var e = document.getElementById('blazor-errors');
        if(!e) return;
        e.style.display = 'block';
        var p = document.createElement('div'); p.innerText = msg; e.appendChild(p);
      }

      window.addEventListener('error', function(evt){
        setStatus('runtime error');
        showError('Error: ' + (evt && evt.message ? evt.message : JSON.stringify(evt)));
      });

      window.addEventListener('unhandledrejection', function(evt){
        setStatus('unhandled rejection');
        showError('Unhandled Rejection: ' + (evt && evt.reason ? (evt.reason.message || JSON.stringify(evt.reason)) : JSON.stringify(evt)));
      });

      // Poll for Blazor availability; Blazor WebAssembly auto-starts normally, so detect when it's loaded.
      setStatus('waiting');
      var checkCount = 0;
      var checker = setInterval(function(){
        checkCount++;
        if(window.Blazor){
          setStatus('loaded');
          // Don't call Blazor.start() here (it may already be auto-started).
          // Instead observe the #app element for when Blazor populates it.
          observeAppStart();
          clearInterval(checker);
        } else if(checkCount > 30){
          setStatus('not found');
          showError('Blazor WebAssembly script not found or failed to load');
          clearInterval(checker);
        }
      }, 200);

      function observeAppStart(){
        var app = document.getElementById('app');
        if(!app) return;
        // If app already populated, assume started
        if(app.children.length > 0 && app.innerHTML.trim() !== 'Loading...'){
          setStatus('started');
          return;
        }
        var mo = new MutationObserver(function(m){
          if(app.children.length > 0 && app.innerHTML.trim() !== 'Loading...'){
            setStatus('started');
            mo.disconnect();
          }
        });
        mo.observe(app, { childList: true, subtree: true, attributes: false });
        // fallback: after 6s, assume started (avoid persistent unknown state)
        setTimeout(function(){ try{ mo.disconnect(); setStatus('started (assumed)'); }catch(e){} }, 6000);
      }
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
  </body>
</html>
